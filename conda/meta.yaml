{% set name = "gwf" %}

{% set version_match = load_file_regex(
  load_file="src/gwf/__init__.py",
  regex_pattern='__version__ = "(.+)"') %}
{% set version = version_match[1] %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ../

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m flit install --deps none"

requirements:
  host:
    - python>=3.10
    - flit
  # Keep in sync with the dependencies in pyproject.toml.
  run:
    - attrs>=21.3
    - click>=8
    - click-plugins>=1.1
    - python>=3.10

test:
  imports:
    - gwf
    - gwf.backends
    - gwf.plugins
  commands:
    - gwf --help
    - gwf --version

about:
  home: https://gwf.app/
  license: GNU General Public v3 (GPLv3)
  license_family: GPL3
  summary: A flexible, pragmatic workflow tool.
  doc_url: https://gwf.app/
  dev_url: https://github.com/gwforg/gwf

extra:
  recipe-maintainers:
    - dansondergaard
